name: Source and native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: cpu
          - os: macos-15
            backend: metal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Source, packaging and checksum tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build server and run native unit checks (no weights)
        run: python3 scripts/build.py --backend ${{ matrix.backend }} --jobs 3
      - name: Export public source snapshot
        run: python3 scripts/package_source.py --output dist/source
      - name: Check Docker context exclusions
        if: runner.os == 'Linux'
        run: |
          mkdir -p private-release .release-work
          printf 'private sentinel' > private-release/must-not-ship.txt
          printf 'private sentinel' > .release-work/must-not-ship.txt
          docker build --target source --output type=local,dest=dist/docker-context .
          python3 scripts/check_package.py --directory dist/docker-context/source
