name: Build prebuilt CUDA container
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested build to GHCR
        type: boolean
        default: false
      cuda_arch:
        description: CUDA architectures (semicolon separated)
        type: string
        default: '86;89;120'
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      CUDA_ARCH: ${{ inputs.cuda_arch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Free unused hosted-runner SDK space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android
      - name: Build
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+(;[0-9]+)*", os.environ["CUDA_ARCH"])'
          docker build --build-arg "CUDA_ARCH=$CUDA_ARCH" --build-arg BUILD_JOBS=2 -t winnow:check .
      - name: Verify packaged runtime without GPU or model
        run: |
          docker run --rm winnow:check --help
          docker run --rm --entrypoint sh winnow:check -c '! ldd /app/.build/bin/winnow-server | grep "not found"'
          docker run --rm --entrypoint python3 winnow:check scripts/download.py --help
      - name: Publish immutable commit tag and cuda tag
        if: inputs.publish && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag winnow:check "$IMAGE:sha-$GITHUB_SHA"
          docker tag winnow:check "$IMAGE:cuda"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:cuda"
          docker logout ghcr.io
          echo "Published $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
